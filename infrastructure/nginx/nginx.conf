# Reverse proxy: routes browser traffic to the React app and API traffic to
# FastAPI, so the whole platform is reachable over a single HTTPS origin
# (blueprint sections 7/8/20).

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream frontend {
        server frontend:80;
    }

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # NOTE: for production, terminate TLS here (or in a layer in front of
        # this proxy) and redirect :80 to :443. Certificates are intentionally
        # left out of this compose file -- see README "Deploying to a server".

        location /api/ {
            proxy_pass http://api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api/health;
        }

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
        }
    }
}

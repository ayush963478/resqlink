# ResQLink -- local/dev/demo stack.
# Run from the infrastructure/ directory: `docker compose up --build`
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resqlink
      POSTGRES_PASSWORD: resqlink
      POSTGRES_DB: resqlink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "15672:15672"  # management UI, optional for the demo/viva
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8000"

  matching-worker:
    build:
      context: ../backend
    command: python -m app.workers.matching_worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - api

  notification-worker:
    build:
      context: ../backend
    command: python -m app.workers.notification_worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - api

  analytics-worker:
    build:
      context: ../backend
    command: python -m app.workers.analytics_worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - api

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
